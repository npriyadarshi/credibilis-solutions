<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Leap — Legal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:       #0d1117;
            --ink-mid:   #3d4a5c;
            --ink-soft:  #6b7a91;
            --ink-ghost: #a8b4c4;
            --surface:   #ffffff;
            --surface-2: #f5f7fa;
            --accent:    #1a56db;
            --border:    #dde3ed;
            --border-2:  #c8d0de;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--surface-2);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 380px;
            padding: 40px 24px;
        }

        /* Wordmark */
        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .brand-mark span {
            font-family: 'DM Serif Display', serif;
            font-size: 24px;
            color: #fff;
            letter-spacing: -1px;
            line-height: 1;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            font-weight: 400;
            color: var(--ink);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--ink-soft);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Link cards */
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .links a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            transition: border-color 0.2s, transform 0.2s;
        }

        .links a:hover {
            border-color: var(--border-2);
            transform: translateY(-1px);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }

        .link-num {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--ink);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .link-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: -0.1px;
        }

        .link-sub {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 2px;
        }

        .link-arrow {
            font-size: 16px;
            color: var(--ink-ghost);
            line-height: 1;
            flex-shrink: 0;
        }

        /* Footer */
        .footer {
            margin-top: 36px;
            font-size: 12px;
            color: var(--ink-ghost);
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="brand-mark"><span>LL</span></div>
        <h1>Lead Leap</h1>
        <p class="subtitle">AI-powered lead analysis &amp; follow-up management</p>

        <div class="links">
            <a href="privacy-policy.html">
                <div class="link-left">
                    <div class="link-num">01</div>
                    <div>
                        <div class="link-label">Privacy Policy</div>
                        <div class="link-sub">How we handle your data</div>
                    </div>
                </div>
                <span class="link-arrow">›</span>
            </a>
            <a href="terms-of-service.html">
                <div class="link-left">
                    <div class="link-num">02</div>
                    <div>
                        <div class="link-label">Terms of Service</div>
                        <div class="link-sub">Your agreement with us</div>
                    </div>
                </div>
                <span class="link-arrow">›</span>
            </a>
        </div>

        <div class="footer">&copy; 2026 Credibilis Solutions LLC</div>
    </div>
</body>
</html>
